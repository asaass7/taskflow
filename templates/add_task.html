{% extends 'base.html' %}
{% block title %}Новая задача — TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
        <div class="form-card shadow-sm">
            <div class="form-card-header">
                <h1 class="h4 mb-0">
                    <i class="bi bi-plus-square text-primary"></i>
                    Новая задача
                </h1>
                <p class="text-muted small mb-0">Заполните поля и нажмите «Создать»</p>
            </div>

            <form method="POST" class="form-card-body">
                <div class="mb-3">
                    <label class="form-label">Название <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control form-control-lg"
                           placeholder="Например: Подготовить отчёт за квартал" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <textarea name="description" class="form-control" rows="4"
                              placeholder="Что нужно сделать? Добавьте детали..."></textarea>
                </div>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Проект</label>
                        <select name="project_id" class="form-select">
                            <option value="">— без проекта —</option>
                            {% for project in projects %}
                                <option value="{{ project.id }}">{{ project.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Приоритет</label>
                        <select name="priority" class="form-select">
                            <option value="low">Низкий</option>
                            <option value="medium" selected>Средний</option>
                            <option value="high">Высокий</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Дедлайн</label>
                        <input type="date" name="due_date" class="form-control">
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary btn-lg">
                        <i class="bi bi-plus-lg"></i> Создать
                    </button>
                    <a class="btn btn-outline-secondary btn-lg" href="{{ url_for('index') }}">
                        Отмена
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
